<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClapIA Video</title>
<style>
:root{color-scheme:dark;--bg:#0b0b10;--panel:#15151d;--border:#2a2a35;--text:#f6f6f7;--muted:#a6a6b2;--accent:#8b7cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
main{max-width:720px;margin:auto;padding:18px 14px 40px}
.hero,.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px}
.brand{font-size:25px;font-weight:800}
.muted{color:var(--muted);font-size:14px}
h2{margin:0 0 4px;font-size:18px}
label{display:block;font-size:14px;margin:12px 0 6px}
textarea,select{width:100%;background:#0e0e14;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:13px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{min-height:48px;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer;background:#1e1e28;border:1px solid var(--border);color:var(--text)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{border:0;background:linear-gradient(90deg,var(--accent),#6f6bff);color:#fff}
button.ghost{background:transparent}
video{width:100%;max-height:560px;border-radius:16px;background:#000;margin-top:12px}
.status{margin-top:10px;color:var(--muted);font-size:14px;min-height:20px}
.status.error{color:#ff8080}
.status.success{color:#8ee6a1}
.header-actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.credits{font-weight:700}
.auth-form{display:flex;gap:8px;flex-wrap:wrap}
.auth-form button{min-height:38px;width:auto;padding:8px 14px}
.input-small{width:180px;padding:8px;border-radius:8px;border:1px solid var(--border);background:#0e0e14;color:var(--text);font-size:14px}
a.secondary{display:block;text-align:center;text-decoration:none;margin-top:10px;padding:14px;border-radius:12px;background:#1e1e28;border:1px solid var(--border);color:var(--text);font-weight:700}
a.secondary:hover{border-color:var(--accent)}
.enhance-row{display:flex;justify-content:flex-end;margin-top:8px}
.enhance-row button{min-height:38px;width:auto;padding:8px 14px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.auth-form{flex-direction:column}.input-small{width:100%}}
</style>
</head>
<body>
<main>
<section class="hero">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <span class="brand">🎬 ClapIA Video</span>
    <div class="header-actions">
      <span class="credits">⚡ <span id="credits">—</span></span>
      <div id="authArea"></div>
    </div>
  </div>
  <div class="muted" style="margin-top:7px">Transforme une idée en vidéo IA.</div>
</section>

<section class="card">
  <h2>Créer une vidéo</h2>
  <label for="prompt">Ton idée</label>
  <textarea id="prompt" rows="4" placeholder="Exemple : Un homme travaille dans un immense champ au coucher du soleil, puis s'arrête et regarde le ciel avec espoir."></textarea>
  <div class="enhance-row">
    <button id="enhance" class="ghost" type="button" title="Améliore ton idée avec l'IA AshnaAI">✨ Améliorer mon idée</button>
  </div>

  <div class="grid">
    <div><label for="ratio">Format</label>
      <select id="ratio"><option value="9:16">9:16 — TikTok / Shorts</option><option value="16:9">16:9 — YouTube</option><option value="1:1">1:1 — Social</option></select>
    </div>
    <div><label for="duration">Durée</label>
      <select id="duration"><option value="5">5 secondes</option><option value="8">8 secondes</option><option value="10">10 secondes</option></select>
    </div>
  </div>

  <label for="style">Style</label>
  <select id="style"><option>Cinématique réaliste</option><option>Hyperréaliste</option><option>Documentaire</option><option>Animation 3D</option></select>

  <button id="generate" class="primary" style="margin-top:15px;width:100%">✨ Générer la vidéo</button>
  <div id="status" class="status" aria-live="polite"></div>
</section>

<section id="output" class="card" hidden>
  <h2>Résultat</h2>
  <video id="video" controls playsinline></video>
  <a id="download" class="secondary" download="clapia-video.mp4">⬇️ Ouvrir / télécharger</a>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const promptEl=$("prompt"), ratio=$("ratio"), duration=$("duration"), style=$("style");
const generate=$("generate"), enhance=$("enhance"), statusEl=$("status"), output=$("output"), video=$("video"), download=$("download"), creditsEl=$("credits");
const authArea=$("authArea");

function authHeader(){
  const token = localStorage.getItem('token');
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

function setStatus(msg, kind){
  statusEl.textContent = msg;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}

function renderAuth() {
  const token = localStorage.getItem('token');
  if (!token) {
    authArea.innerHTML = `
      <div class="auth-form">
        <input id="email" class="input-small" type="email" placeholder="email@example.com" autocomplete="email" />
        <input id="password" type="password" class="input-small" placeholder="Mot de passe" autocomplete="current-password" />
        <button id="btnLogin" class="primary">Se connecter</button>
        <button id="btnRegister" class="ghost">S'inscrire</button>
      </div>
    `;
    $('#btnLogin').addEventListener('click', login);
    $('#btnRegister').addEventListener('click', register);
  } else {
    authArea.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px">
        <button id="btnLogout" class="ghost" style="min-height:38px;width:auto;padding:8px 14px">Se déconnecter</button>
      </div>
    `;
    $('#btnLogout').addEventListener('click', () => { localStorage.removeItem('token'); renderAuth(); loadCredits(); });
  }
}

async function register(){
  const email = $('#email').value.trim();
  const password = $('#password').value;
  if(!email || !password) return setStatus('Email et mot de passe requis.', 'error');
  try{
    const res = await fetch('/api/register', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error||'Erreur');
    localStorage.setItem('token', data.token);
    creditsEl.textContent = data.credits;
    renderAuth();
  }catch(e){ setStatus(e.message, 'error'); }
}

async function login(){
  const email = $('#email').value.trim();
  const password = $('#password').value;
  if(!email || !password) return setStatus('Email et mot de passe requis.', 'error');
  try{
    const res = await fetch('/api/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error||'Erreur');
    localStorage.setItem('token', data.token);
    creditsEl.textContent = data.credits;
    renderAuth();
  }catch(e){ setStatus(e.message, 'error'); }
}

async function loadCredits(){
  try{
    const headers = Object.assign({}, authHeader());
    const res = await fetch('/api/credits', { headers });
    if(res.status === 401){ localStorage.removeItem('token'); renderAuth(); }
    if(res.ok){
      const data = await res.json();
      creditsEl.textContent = data.credits ?? 0;
    } else {
      creditsEl.textContent = 0;
    }
  } catch(e){ creditsEl.textContent = 0 }
}

renderAuth();
loadCredits();

// ✨ Améliorer l'idée avec l'IA AshnaAI
enhance.addEventListener("click", async () => {
  const idea = promptEl.value.trim();
  if(idea.length < 3){ setStatus("Écris d'abord une idée à améliorer."); promptEl.focus(); return }
  enhance.disabled = true;
  setStatus("Amélioration de ton idée avec l'IA…");
  try{
    const headers = Object.assign({'Content-Type':'application/json'}, authHeader());
    const res = await fetch('/api/enhance', {
      method:'POST', headers,
      body: JSON.stringify({ prompt: idea, style: style.value })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Erreur');
    promptEl.value = data.prompt;
    setStatus("✨ Idée améliorée par l'IA. Tu peux la modifier ou générer la vidéo.", 'success');
  }catch(err){
    setStatus("❌ " + err.message, 'error');
  }finally{
    enhance.disabled = false;
  }
});

generate.addEventListener("click", async () => {
  const idea=promptEl.value.trim();
  const credits=Number(creditsEl.textContent)||0;
  if(idea.length<3){ setStatus("Écris une idée de vidéo."); promptEl.focus(); return }
  if(credits < 5){ setStatus("Crédits insuffisants. Recharge ou connecte-toi pour récupérer tes crédits.", 'error'); return }

  const finalPrompt=`${idea}. Style: ${style.value}. Cinematic camera movement, natural motion, coherent subject, detailed environment, professional lighting, high visual quality, no text, no watermarks.`;
  generate.disabled=true;
  setStatus("Génération en cours… cela peut prendre un moment.");

  try{
    const headers = Object.assign({'Content-Type':'application/json'}, authHeader());
    const response=await fetch("/api/generate",{
      method:"POST",headers,body:JSON.stringify({prompt:finalPrompt,aspect_ratio:ratio.value,duration:Number(duration.value)})
    });
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||"Erreur serveur");
    if(typeof data.credits !== 'undefined') creditsEl.textContent = data.credits;
    video.src=data.videoUrl;
    download.href=data.videoUrl;
    output.hidden=false;
    setStatus("✅ Vidéo générée avec succès.", 'success');
  }catch(err){
    setStatus("❌ "+err.message, 'error');
  }finally{
    generate.disabled=false;
    loadCredits();
  }
});
</script>
</body>
</html>
